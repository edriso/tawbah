<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafbfc" />
    <meta
      name="description"
      content="توبة — مساحة هادئة للاستغفار، مع جلسات مؤقتة وتذكير صوتي اختياري."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>توبة — مساحة للاستغفار</title>
    <script>
      try {
        const t = localStorage.getItem("tawbah-theme");
        document.documentElement.dataset.theme =
          t === "dark" || t === "light"
            ? t
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
    </script>
  </head>
  <body>
    <div class="landscape" aria-hidden="true">
      <div class="distant distant-right"></div>
      <div class="distant distant-left"></div>
      <img
        id="mountain"
        src="/mountain.webp"
        width="1536"
        height="1024"
        alt=""
        fetchpriority="high"
      />
    </div>

    <header class="header">
      <a class="wordmark" href="./" aria-label="توبة — الصفحة الرئيسية">توبة</a>
      <button
        id="settings-open"
        class="icon-button"
        aria-label="الإعدادات"
        aria-haspopup="dialog"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          aria-hidden="true"
        >
          <path d="M4 7h16M4 17h16" />
          <circle cx="9" cy="7" r="3" fill="var(--bg)" />
          <circle cx="15" cy="17" r="3" fill="var(--bg)" />
        </svg>
      </button>
    </header>
    <main id="main">
      <div class="intro">
        <p class="sr-only" id="eyebrow">لحظاتٌ لذكر الله</p>
        <h1>أستغفر الله<span>وأتوب إليه</span></h1>
        <p class="subtitle" aria-hidden="true">
          أستغفر الله<span>وأتوب إليه</span>
        </p>
      </div>
      <section class="session" aria-label="جلسة الاستغفار">
        <div id="setup" class="setup">
          <fieldset>
            <legend>مدة الجلسة</legend>
            <div class="choices" id="durations">
              <label
                ><input type="radio" name="duration" value="5" checked /><span
                  >٥ دقائق</span
                ></label
              >
              <label
                ><input type="radio" name="duration" value="10" /><span
                  >١٠ دقائق</span
                ></label
              >
              <label
                ><input type="radio" name="duration" value="15" /><span
                  >١٥ دقيقة</span
                ></label
              >
              <label
                ><input type="radio" name="duration" value="30" /><span
                  >٣٠ دقيقة</span
                ></label
              >
            </div>
          </fieldset>
          <button id="start" class="primary">
            ابدأ الاستغفار <span aria-hidden="true">←</span>
          </button>
        </div>
        <div id="active" class="active" hidden>
          <p id="session-label" class="eyebrow">وقت للذكر</p>
          <div
            id="timer"
            class="timer"
            role="timer"
            aria-label="الوقت المتبقي"
            dir="ltr"
          >
            ٠٥:٠٠
          </div>
          <progress
            id="progress"
            max="1"
            value="0"
            aria-label="تقدم الجلسة"
          ></progress>
          <div class="session-actions">
            <button id="pause" class="secondary">إيقاف مؤقت</button
            ><button id="finish" class="text-button">إنهاء الجلسة</button>
          </div>
        </div>
        <div id="done" class="done" hidden>
          <p class="eyebrow" id="done-label">اكتملت جلستك</p>
          <h2>تقبّل الله منك</h2>
          <button id="restart" class="primary">
            جلسة جديدة <span aria-hidden="true">←</span>
          </button>
        </div>
        <p id="announcement" role="status" class="sr-only"></p>
      </section>
    </main>
    <footer>
      <p id="quote-label" class="quote-label"></p>
      <blockquote>
        <span id="quote-open" aria-hidden="true"></span><span id="quote"></span
        ><span id="quote-close" aria-hidden="true"></span>
      </blockquote>
      <a
        id="quote-source"
        class="quote-reference"
        target="_blank"
        rel="noopener noreferrer"
      ></a>
    </footer>
    <dialog id="settings" aria-labelledby="settings-title">
      <div class="settings-heading">
        <h2 id="settings-title">الإعدادات</h2>
        <button
          id="settings-close"
          class="icon-button"
          aria-label="إغلاق الإعدادات"
        >
          ×
        </button>
      </div>
      <div class="setting-row">
        <span>المظهر</span
        ><button
          id="theme"
          class="icon-button"
          aria-label="تفعيل المظهر الداكن"
        ></button>
      </div>
      <div class="sound-row">
        <label class="sound-label" for="sound"
          ><span id="sound-icon" aria-hidden="true"></span>تذكير
          بالاستغفار</label
        ><button
          id="sound"
          class="switch"
          role="switch"
          aria-checked="false"
          aria-label="تذكير بالاستغفار"
        >
          <span></span>
        </button>
      </div>
      <div class="setting-row">
        <label for="voice">صوت الاستغفار</label>
        <select id="voice">
          <option value="bader">بدر النفيس</option>
          <option value="short">الصوت القصير</option>
        </select>
      </div>
      <div id="sound-options" class="sound-options" hidden>
        <label for="interval">كل</label
        ><select id="interval" aria-label="الفاصل بين التنبيهات">
          <option value="10">١٠ ثوانٍ</option>
          <option value="20" selected>٢٠ ثانية</option>
          <option value="30">٣٠ ثانية</option></select
        ><button id="preview-sound" class="text-button">تجربة الصوت</button>
      </div>

      <div class="sound-row">
        <label class="sound-label" for="completion-sound"
          >نغمة نهاية الجلسة</label
        >
        <button
          id="completion-sound"
          class="switch"
          role="switch"
          aria-checked="false"
          aria-label="نغمة نهاية الجلسة"
        >
          <span></span>
        </button>
      </div>
      <button id="preview-chime" class="text-button">تجربة النغمة</button>
      <p id="audio-error" class="micro" role="status" hidden>
        تعذّر تشغيل الصوت. يمكنك متابعة الجلسة بهدوء.
      </p>
      <a
        class="settings-link"
        href="https://github.com/edriso/tawbah"
        target="_blank"
        rel="noopener noreferrer"
        >المشروع على GitHub ↗</a
      >
      <p class="audio-credit" id="credit-short" hidden>
        الصوت:
        <a
          href="https://commons.wikimedia.org/wiki/File:Ar-أستغفر_الله.ogg"
          target="_blank"
          rel="noopener noreferrer"
          >ArabicAudios</a
        >
        ·
        <a
          href="https://creativecommons.org/licenses/by-sa/3.0/"
          target="_blank"
          rel="noopener noreferrer"
          >CC BY-SA 3.0</a
        >
      </p>
      <p class="audio-credit" id="credit-bader">
        الصوت:
        <a
          href="https://www.youtube.com/watch?v=mjf4K7aVuUc"
          target="_blank"
          rel="noopener noreferrer"
          >بدر النفيس · المصدر</a
        >
      </p>
    </dialog>
    <audio
      id="voice-bader"
      src="/istighfar-bader.mp3"
      preload="none"
      hidden
    ></audio>
    <audio
      id="completion-file"
      src="/completion-pop.mp3"
      preload="none"
      hidden
    ></audio>
    <audio id="voice-file" src="/istighfar.mp3" preload="none" hidden></audio>
    <noscript>يرجى تفعيل JavaScript لتشغيل جلسة الاستغفار.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
